spring.application.name=price-parser

spring.datasource.url=jdbc:h2:mem:prices
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

parser.worker-count=4
parser.queue-capacity=100
parser.max-catalog-pages=3
parser.connect-timeout=5s
parser.read-timeout=15s
parser.max-fetch-attempts=3
parser.refresh-interval=10m
parser.user-agent=price-parser/1.0
parser.log-file=logs/parser.log
