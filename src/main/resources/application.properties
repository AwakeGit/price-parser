spring.application.name=price-parser

management.endpoints.web.exposure.include=health,info,metrics,threaddump,prometheus
management.endpoint.health.show-details=always
management.info.env.enabled=true
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.percentiles-histogram.parser.parsing.duration=true

info.app.name=price-parser
info.app.description=Multithreaded book price parser
info.app.version=0.0.1-SNAPSHOT

spring.datasource.url=jdbc:h2:mem:prices
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

parser.worker-count=4
parser.queue-capacity=100
parser.max-catalog-pages=3
parser.connect-timeout=5s
parser.read-timeout=15s
parser.max-fetch-attempts=3
parser.refresh-interval=10m
parser.user-agent=price-parser/1.0
parser.log-file=logs/parser.log
